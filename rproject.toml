repositories = [
  { alias = "prism-current", url = "https://prism.dev.a2-ai.cloud/rpkgs/stratus/2025-12-15/" },
	# has rms 6.7.1 for R4.3 compatibility	
  { alias = "prism-old", url = "https://prism.dev.a2-ai.cloud/rpkgs/stratus/2025-05-09/" },
]

dependencies = [
  "devtools",
  "covr",
  { name = "cqtkit", path = ".", dependencies_only = true, install_suggestions = true },
	{ name = "starlightr", git = "https://github.com/a2-ai/starlightr", branch = "main"},
]

