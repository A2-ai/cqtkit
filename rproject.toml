use_lockfile = false

[project]
name = "cqtkit"
r_version = "4.5"

repositories = [
	{ alias = "prism-current", url = "https://prism.dev.a2-ai.cloud/rpkgs/stratus/2026-06-30/" },
	# has rms 6.7.1 for R4.3 compatibility
	{ alias = "prism-old", url = "https://prism.dev.a2-ai.cloud/rpkgs/stratus/2025-05-09/" },
	{ alias = "ggstylekit", url = "https://prism.dev.a2-ai.cloud/rpkgs/ggstylekit/latest/" },
	# dev deps
	{ alias = "starlightr", url = "https://prism.dev.a2-ai.cloud/rpkgs/starlightr/latest/" },
]

dependencies = [
	"devtools",
	"starlightr",
	{ name = "covr", install_suggestions = true },
	{ name = "cqtkit", path = ".", dependencies_only = false, install_suggestions = true },
]
