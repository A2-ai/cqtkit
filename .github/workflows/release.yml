          - {"name":"macos-arm64","runner":"macos-15","container":null,"os_release_id":null,"arch":"arm64","r":"4.4","repo":"https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.04","sysdeps":"none","sysdeps_ignore":"","sysdeps_extra":"","toolchain":"auto","rust":"auto"}
