        shell: bash
        run: rv sync --r-bin "$(command -v R)" --r-version "$BUILD_R"

      - name: Get library path
        id: library
        shell: bash
        run: echo "result=$(rv library --r-bin "$(command -v R)" --r-version "$BUILD_R")" >> "$GITHUB_OUTPUT"

      - name: Build source tarball
        id: build-src
        uses: A2-ai/r-releaser/build-src@feat/gh-compatibility
        with:
          library: ${{ steps.library.outputs.result }}
          resave-data: false
          md5: true
          user: r-releaser
          build-vignettes: false
          metadata: |
            {
              "PrismRemoteType": "git",
              "PrismRemoteRef": "${{ needs.preflight.outputs.tag }}",
              "PrismRemoteSha": "${{ github.sha }}"
            }

      - name: Upload source tarball to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.build-src.outputs.tarball_path }}
          asset_name: ${{ steps.build-src.outputs.tarball_name }}
          tag: ${{ needs.preflight.outputs.tag }}
          release_name: ${{ needs.preflight.outputs.tag }}
          overwrite: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.preflight.outputs.is_prerelease == 'true' && 'false' || 'legacy' }}

      - name: Upload source tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: ${{ steps.build-src.outputs.tarball_path }}
          if-no-files-found: error

      - name: Build binary
        id: build-bin
        uses: A2-ai/r-releaser/build-bin@feat/gh-compatibility
        with:
          library: ${{ steps.library.outputs.result }}
          src_tarball_path: ${{ steps.build-src.outputs.tarball_path }}
          linking_to_deps: ${{ steps.build-src.outputs.linking_to_deps }}
          no_sys_deps: true

      - name: Upload binary to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.build-bin.outputs.binary_path }}
          asset_name: ${{ steps.build-bin.outputs.binary_name }}
          tag: ${{ needs.preflight.outputs.tag }}
          release_name: ${{ needs.preflight.outputs.tag }}
          overwrite: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.preflight.outputs.is_prerelease == 'true' && 'false' || 'legacy' }}

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: "manifest-almalinux8-x86_64-r4.6"
          path: manifest.json
          if-no-files-found: error

