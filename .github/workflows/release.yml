      tag: ${{ steps.tag.outputs.tag }}
      is_rc: ${{ steps.tag.outputs.is_rc }}
      is_dev: ${{ steps.tag.outputs.is_dev }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
      package_name: ${{ steps.pkg-info.outputs.name }}
      package_version: ${{ steps.pkg-info.outputs.version }}
