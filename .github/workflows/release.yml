name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string
      build:
        description: Rebuild this tag's release assets (overwrites what is attached to the Release)
        required: false
        default: false
        type: boolean
      publish:
        description: Deploy this tag's release assets to PRISM (a prerelease deploys only when asked)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# One run at a time per tag. A second run for the same tag waits as pending
# rather than racing the first's uploads: `gh prism release --deploy` on a fresh
# prerelease relies on this to queue its deploy-only dispatch behind the build.
# Only one run can be pending; a newer one replaces it.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

