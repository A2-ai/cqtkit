  # ===========================================================================
  deploy-skipped:
    name: Deploy skipped (prerelease)
    needs: [preflight, finalize]
    if: >-
      !cancelled() &&
      needs.finalize.result == 'success' &&
      needs.preflight.outputs.is_prerelease == 'true' &&
      inputs.publish != true
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          KIND: ${{ needs.preflight.outputs.is_rc == 'true' && 'a release candidate' || 'a development version' }}
        run: |
          echo "::notice::$TAG is $KIND — PRISM deploy skipped. To deploy it anyway run: gh prism release $TAG --deploy (publishes the assets already attached to this Release — no rebuild, so what reaches PRISM is exactly what was built and tested here)"
