        if: env.BUILD_CONTAINER == '' && runner.os == 'macOS'
        uses: a2-ai/r-gh-mac-build/prep@main
        with:
          r-version: ${{ env.BUILD_R }}

      - name: Configure repository
        shell: bash
        run: rv configure repository replace prism --alias prism --url https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.06

      - name: Setup build environment
        uses: A2-ai/r-releaser/setup-build-env@feat/gh-compatibility
        with:
          toolchain: "auto"
          rust: "auto"
          sysdeps: "auto"
          sysdeps_ignore: "libgit2_1.7-devel pandoc"
          sysdeps_extra: "libgit2-devel libcurl-devel"

      # --r-bin selects the R already on PATH and --r-version overrides the
      # r_version in the rv config (rv >= 0.23.0). Both are needed: rv refuses
      # --r-version alone when it differs from the config. The config file is not
      # rewritten. rv.lock is read and written only when the selected R matches
      # the configured one; for any other R, rv neither reads nor updates it.
