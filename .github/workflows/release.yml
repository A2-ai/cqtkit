          - {"name":"almalinux8-x86_64","runner":"ubuntu-latest","container":"almalinux:8","os_release_id":"almalinux","arch":"x86_64","r":"4.4","repo":"https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.04","sysdeps":"auto","sysdeps_ignore":"libgit2_1.7-devel pandoc","sysdeps_extra":"libgit2-devel libcurl-devel","toolchain":"auto","rust":"auto"}
          - {"name":"macos-arm64","runner":"macos-15","container":null,"os_release_id":null,"arch":"arm64","r":"4.6","repo":"https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.06","sysdeps":"none","sysdeps_ignore":"","sysdeps_extra":"","toolchain":"auto","rust":"auto"}
