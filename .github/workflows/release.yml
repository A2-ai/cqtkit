      # the Release has to be whole. Pending runs in the concurrency group are
      # not strictly ordered, so a deploy queued behind a build can in principle
      # run first; this turns that into a clear failure instead of a partial
      # deploy, and guards hand dispatches the same way.
      - name: Check the release is complete before publishing
