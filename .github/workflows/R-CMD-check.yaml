# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: main
  pull_request:
    branches: main

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: '4.6', prism: '2026.06'}
          - {os: windows-latest, r: '4.6', prism: '2026.06'}
          - {os: ubuntu-latest,  r: '4.6', prism: '2026.06'}
          - {os: ubuntu-latest,  r: '4.5', prism: '2026.06'}
          - {os: ubuntu-latest,  r: '4.4', prism: '2026.04'}
          - {os: ubuntu-latest,  r: '4.3', prism: '2025.06'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RV_R_VERSION: ${{ matrix.config.r }}
      PRISM_REPOSITORY: https://prism.dev.a2-ai.cloud/rpkgs/nimbus/${{ matrix.config.prism }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: false
          cran: ${{ env.PRISM_REPOSITORY }}
          extra-repositories: |
            https://prism.dev.a2-ai.cloud/rpkgs/ggstylekit/latest
            https://prism.dev.a2-ai.cloud/rpkgs/starlightr/latest

      - uses: a2-ai/setup-rv@main
        with:
          version: '0.23.1'

      - name: Select the installed R for rv
        shell: Rscript --vanilla {0}
        run: |
          r_bin <- normalizePath(Sys.which("R"), winslash = "/", mustWork = TRUE)
          # The project .Rprofile uses the TOML R version to choose its library.
          # CI selects the library explicitly below instead.
          profile <- file.path(Sys.getenv("RUNNER_TEMP"), "cqtkit-ci.Rprofile")
          file.create(profile)
          cat(
            paste0("RV_R_BIN=", r_bin),
            paste0("R_PROFILE_USER=", profile),
            sep = "\n", file = Sys.getenv("GITHUB_ENV"), append = TRUE
          )
          cat("\n", file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      - name: Configure repositories
        shell: bash
        run: |
          rv configure repository replace prism --alias prism --url "$PRISM_REPOSITORY"

      - name: rv-plan
        shell: bash
        run: rv plan --r-bin "$RV_R_BIN" --r-version "$RV_R_VERSION"

      - name: rv-sysdeps-install (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          MISSING_DEPS=$(rv plan --r-bin "$RV_R_BIN" --r-version "$RV_R_VERSION" --json | jq -r '.installed[].sys_deps[]? | select(.status == "absent") | .name')
          if [ -n "$MISSING_DEPS" ]; then
            echo "Found missing system dependencies:"
            echo "$MISSING_DEPS"
            echo "Installing..."
            echo "$MISSING_DEPS" | xargs sudo apt install
          else
            echo "All system dependencies are present"
          fi
      - name: rv-sync
        shell: bash
        run: rv sync --r-bin "$RV_R_BIN" --r-version "$RV_R_VERSION"

      - name: Use the rv library for package checks
        shell: bash
        run: |
          echo "R_LIBS_USER=$(rv library --r-bin "$RV_R_BIN" --r-version "$RV_R_VERSION")" >> "$GITHUB_ENV"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
