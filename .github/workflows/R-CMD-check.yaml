# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: main
  pull_request:
    branches: main

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: '4.6', repo: 'https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.06'}
          - {os: windows-latest, r: '4.6', repo: 'https://packagemanager.posit.co/cran/latest'}
          - {os: ubuntu-latest,  r: '4.6', repo: 'https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.06'}
          - {os: ubuntu-latest,  r: '4.5', repo: 'https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.06'}
          - {os: ubuntu-latest,  r: '4.4', repo: 'https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.04'}
          - {os: ubuntu-latest,  r: '4.3', repo: 'https://prism.dev.a2-ai.cloud/rpkgs/stratus/2025-05-09/'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RV_R_VERSION: ${{ matrix.config.r }}
      RV_R_BIN: R
      CRAN_REPOSITORY: ${{ matrix.config.repo }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: a2-ai/setup-rv@main

      - name: Configure repositories
        shell: bash
        run: |
          rv configure repository replace prism --alias prism --url "$CRAN_REPOSITORY"

      - name: rv-plan
        shell: bash
        run: rv plan

      - name: rv-sysdeps-install (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          MISSING_DEPS=$(rv plan --json | jq -r '.installed[].sys_deps[]? | select(.status == "absent") | .name')
          if [ -n "$MISSING_DEPS" ]; then
            echo "Found missing system dependencies:"
            echo "$MISSING_DEPS"
            echo "Installing..."
            echo "$MISSING_DEPS" | xargs sudo apt install
          else
            echo "All system dependencies are present"
          fi

      - name: rv-sync
        shell: bash
        run: rv sync

      - name: Use the rv library for package checks
        shell: bash
        run: |
          touch "$RUNNER_TEMP/empty.Rprofile"
          echo "R_PROFILE_USER=$RUNNER_TEMP/empty.Rprofile" >> "$GITHUB_ENV"
          echo "R_LIBS_USER=$GITHUB_WORKSPACE/$(rv library)" >> "$GITHUB_ENV"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
